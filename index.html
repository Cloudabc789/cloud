<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫雷 · 阮叉叉版</title>
    <style>
        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #1a1a2e, #16213e 50%, #0f0f1a);
            padding: 20px;
            margin: 0;
            -webkit-touch-callout: none;
        }

        /* ========== 主容器 — 阮叉叉版 ========== */
        .glass-container {
            width: 100%;
            max-width: 780px;
            padding: 32px 36px 40px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        /* ========== 标题 ========== */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .title span {
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== 控制栏 ========== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 14px;
            margin-bottom: 18px;
        }

        .difficulty-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-glass {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            outline: none;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        }
        .btn-glass:active {
            transform: scale(0.96);
        }
        .btn-glass.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.15);
        }
        .btn-glass.custom-toggle {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* ========== 自定义面板 ========== */
        .custom-panel {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 16px;
            margin-top: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .custom-panel.show {
            display: flex;
        }
        .custom-panel label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .custom-panel input {
            width: 56px;
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border 0.2s;
        }
        .custom-panel input:focus {
            border-color: rgba(79, 172, 254, 0.6);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.08);
        }
        .custom-panel input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .custom-panel input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ========== 游戏信息栏 ========== */
        .game-info {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 16px;
        }
        .game-info .info-group {
            justify-self: start;
        }
        .game-info > .info-item:last-of-type {
            justify-self: end;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .info-group {
            display: flex;
            gap: 4px;
        }
        .info-item .icon {
            font-size: 20px;
            opacity: 0.8;
        }
        .info-item .value {
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }
        .reset-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: rotate(30deg) scale(1.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .reset-btn:active {
            transform: rotate(60deg) scale(0.92);
        }

        /* ========== 游戏面板 ========== */
        .board-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .board {
            display: grid;
            gap: 3px;
            width: 100%;
            aspect-ratio: auto;
            border-radius: 20px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.15);
        }

        /* ========== 格子样式 — 阮叉叉版 ========== */
        .cell {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .cell:hover:not(.opened):not(.game-over):not(.paused) {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .cell:active:not(.opened):not(.game-over):not(.paused) {
            transform: scale(0.94);
        }

        /* 已打开 */
        .cell.opened {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.25);
            cursor: default;
            transform: none !important;
        }

        /* 旗帜 */
        .cell.flagged {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
        }
        .cell.flagged::after {
            content: "🚩";
            font-size: 22px;
            filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.3));
        }

        /* 问号 */
        .cell.question::after {
            content: "❓";
            font-size: 20px;
            opacity: 0.7;
        }

        /* 地雷 */
        .cell.mine-exploded {
            background: rgba(255, 50, 50, 0.3) !important;
            border-color: rgba(255, 50, 50, 0.5) !important;
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.2) !important;
        }
        .cell.mine-shown {
            background: rgba(255, 100, 100, 0.08);
        }
        .cell.mine-shown::after {
            content: "💣";
            font-size: 20px;
            opacity: 0.8;
        }

        /* 数字颜色 */
        .cell.n1 { color: #6cb4ee; }
        .cell.n2 { color: #6fcf97; }
        .cell.n3 { color: #f28b8b; }
        .cell.n4 { color: #bb8fce; }
        .cell.n5 { color: #f7b773; }
        .cell.n6 { color: #7ec8e3; }
        .cell.n7 { color: #b0a8b0; }
        .cell.n8 { color: #a8b0b0; }

        /* ========== 高亮效果 ========== */
        .cell.highlight {
            background: rgba(79, 172, 254, 0.25) !important;
            border-color: rgba(79, 172, 254, 0.4) !important;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.2) !important;
            transition: all 0.1s ease;
        }
        .cell.highlight.opened {
            background: rgba(79, 172, 254, 0.15) !important;
            border-color: rgba(79, 172, 254, 0.3) !important;
        }

        /* ========== 游戏结束遮罩（通用） ========== */
        .game-overlay {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            gap: 20px;
            padding: 20px;
        }
        .game-overlay.show {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }
        .game-overlay .msg {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.06);
            padding: 16px 40px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            letter-spacing: 1px;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        .game-overlay.show .msg {
            transform: scale(1);
        }
        .game-overlay .msg.win {
            background: rgba(79, 172, 254, 0.15);
            border-color: rgba(79, 172, 254, 0.2);
        }
        .game-overlay .msg.lose {
            background: rgba(255, 50, 50, 0.12);
            border-color: rgba(255, 50, 50, 0.15);
        }
        .game-overlay .sub-info {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 24px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .game-overlay .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-overlay .btn-overlay {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            outline: none;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border 0.3s;
        }
        .game-overlay.show .btn-overlay {
            transform: scale(1);
        }
        .game-overlay .btn-overlay:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }
        .game-overlay .btn-overlay:active {
            transform: scale(0.95);
        }
        .game-overlay .btn-overlay.primary {
            background: rgba(79, 172, 254, 0.25);
            border-color: rgba(79, 172, 254, 0.3);
        }
        .game-overlay .btn-overlay.primary:hover {
            background: rgba(79, 172, 254, 0.35);
        }
        .game-overlay .btn-overlay.danger {
            background: rgba(255, 50, 50, 0.2);
            border-color: rgba(255, 50, 50, 0.25);
        }
        .game-overlay .btn-overlay.danger:hover {
            background: rgba(255, 50, 50, 0.3);
        }
        .game-overlay .btn-overlay:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: scale(0.9) !important;
            pointer-events: none;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .glass-container {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }
            .title {
                font-size: 22px;
                margin-bottom: 14px;
            }
            .controls { gap: 8px; }
            .btn-glass {
                padding: 6px 14px;
                font-size: 12px;
            }
            .game-info {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
            .game-info .info-group {
                justify-self: auto;
            }
            .game-info > .info-item:last-of-type {
                justify-self: auto;
            }
            .info-item {
                font-size: 12px;
                padding: 4px 10px;
            }
            .info-group {
                gap: 3px;
            }
            .reset-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .cell {
                border-radius: 8px;
                font-size: 13px;
            }
            .cell.flagged::after { font-size: 16px; }
            .cell.question::after { font-size: 15px; }
            .cell.mine-shown::after { font-size: 15px; }
            .board { gap: 2px; padding: 4px; }
            .custom-panel { padding: 10px 14px; gap: 6px 12px; }
            .custom-panel label { font-size: 12px; }
            .custom-panel input { width: 44px; padding: 4px 6px; font-size: 12px; }
            .game-overlay .msg { font-size: 20px; padding: 12px 28px; }
            .game-overlay .btn-overlay { font-size: 16px; padding: 10px 24px; }
            .game-overlay .sub-info { font-size: 15px; padding: 4px 18px; }
        }

        @media (max-width: 420px) {
            .glass-container {
                padding: 14px 10px 20px;
                border-radius: 24px;
            }
            .btn-glass { padding: 5px 10px; font-size: 11px; }
            .cell {
                border-radius: 6px;
                font-size: 11px;
            }
            .cell.flagged::after { font-size: 13px; }
            .board { gap: 1.5px; padding: 3px; }
            .info-item { font-size: 11px; padding: 3px 8px; }
            .info-group { gap: 2px; }
            .reset-btn { width: 34px; height: 34px; font-size: 16px; }
            .game-overlay .msg { font-size: 16px; padding: 10px 20px; }
            .game-overlay .btn-overlay { font-size: 14px; padding: 8px 18px; }
            .game-overlay .sub-info { font-size: 13px; padding: 4px 14px; }
        }

        /* ========== 手机端操作菜单 ========== */
        .mobile-menu {
            position: fixed;
            z-index: 999;
            background: rgba(22, 22, 48, 0.96);
            backdrop-filter: blur(20px) saturate(2);
            -webkit-backdrop-filter: blur(20px) saturate(2);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 10px 8px;
            display: flex;
            gap: 6px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            opacity: 0;
            transform: scale(0.85) translateY(8px);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            touch-action: manipulation;
        }
        .mobile-menu.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .mobile-menu-btn {
            width: 56px;
            height: 64px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .mobile-menu-btn .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .mobile-menu-btn:active {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(0.9);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .mobile-menu-btn.flag-btn:active {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.3);
        }
        .mobile-menu-btn.highlight-btn:active {
            background: rgba(79, 172, 254, 0.2);
            border-color: rgba(79, 172, 254, 0.3);
        }
        .mobile-menu-btn.question-btn:active {
            background: rgba(255, 165, 0, 0.2);
            border-color: rgba(255, 165, 0, 0.3);
        }

        /* 手机端菜单按钮 — 禁用态 */
        .mobile-menu-btn.disabled {
            opacity: 0.25;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* 手机端菜单遮罩（用于点击外部关闭） */
        .mobile-menu-backdrop {
            position: fixed;
            inset: 0;
            z-index: 998;
            background: transparent;
            pointer-events: none;
            touch-action: manipulation;
        }
        .mobile-menu-backdrop.active {
            pointer-events: auto;
        }

        /* ========== 触摸设备禁用 hover 效果 ========== */
        @media (hover: none) and (pointer: coarse) {
            .cell:hover:not(.opened):not(.game-over):not(.paused) {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.06);
                transform: none;
                box-shadow:
                    0 2px 8px rgba(0, 0, 0, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
            .cell:active:not(.opened):not(.game-over):not(.paused) {
                transform: scale(0.94);
                background: rgba(255, 255, 255, 0.16);
            }
            .btn-glass:hover {
                background: rgba(255, 255, 255, 0.06);
                color: rgba(255, 255, 255, 0.75);
                transform: none;
                border-color: rgba(255, 255, 255, 0.08);
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            }
            .btn-glass:active {
                background: rgba(255, 255, 255, 0.14);
                transform: scale(0.96);
            }
            .reset-btn:hover {
                background: rgba(255, 255, 255, 0.06);
                transform: none;
                border-color: rgba(255, 255, 255, 0.08);
            }
            .game-overlay .btn-overlay:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.15);
                transform: scale(1);
            }
        }

        /* ========== 帮助按钮 ========== */
        .help-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            outline: none;
            flex-shrink: 0;
        }
        .help-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }
        .help-btn:active {
            transform: scale(0.92);
        }

        /* ========== 帮助弹窗 ========== */
        .help-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .help-overlay.show {
            display: flex;
        }
        .help-modal {
            background: rgba(22, 22, 48, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;

<body>

    <div class="glass-container">
        <!-- 标题 -->
        <div class="title">✦ <span>扫雷</span> · 阮叉叉版</div>

        <!-- 控制栏 -->

            <div class="difficulty-group">
                <button class="btn-glass active" data-diff="easy">简单</button>
                <button class="btn-glass" data-diff="medium">普通</button>

            <button class="help-btn" id="helpBtn" title="操作说明">❓</button>

        <!-- 自定义面板 -->

            <label>行 <input type="number" id="customRows" value="9" min="4" max="30" /></label>
            <label>列 <input type="number" id="customCols" value="9" min="4" max="30" /></label>
            <label>雷数 <input type="number" id="customMines" value="10" min="1" max="80" /></label>
            <button class="btn-glass" id="applyCustom" style="background:rgba(79,172,254,0.15);border-color:rgba(79,172,254,0.2);">应用</button>

        <!-- 游戏信息 -->
        <div class="game-info">

                </div>
                <div class="info-item">
                    <span class="icon">💣</span>
                    <span class="value" id="mineCount">10</span>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">😊</button>
            <div class="info-item">
                <span class="icon">⏱</span>
                <span class="value" id="timerDisplay">0000</span>
            </div>
        </div>

        <!-- 棋盘 -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
            <div class="game-overlay" id="gameOverlay">
                <div class="msg" id="resultMsg">🎉 你赢了！</div>
                <div class="sub-info" id="subInfo"></div>
                <div class="btn-group" id="overlayButtons">
                    <!-- 动态生成按钮 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 手机端操作菜单 -->
    <div class="mobile-menu-backdrop" id="mobileMenuBackdrop"></div>
    <div class="mobile-menu" id="mobileMenu">
        <button class="mobile-menu-btn flag-btn" data-action="flag">
            🚩<span class="label">插旗</span>
        </button>
        <button class="mobile-menu-btn highlight-btn" data-action="highlight">
            ✨<span class="label">高亮</span>
        </button>
        <button class="mobile-menu-btn question-btn" data-action="question">
            ❓<span class="label">问号</span>
        </button>
    </div>

    <!-- 帮助弹窗 -->
    <div class="help-overlay" id="helpOverlay">
        <div class="help-modal">
            <h3>🎮 游戏操作说明</h3>
            <div class="section">
                <h4>🖥 电脑端</h4>
                <p><span>鼠标左键</span> — 翻开格子；已翻开数字格上旗子数匹配则自动展开周围<br><span>鼠标右键</span> — 弹出操作菜单</p>
            </div>
            <div class="section">
                <h4>📱 手机端</h4>
                <p><span>单击</span> — 翻开格子；已翻开数字格上旗子数匹配则自动展开周围<br><span>长按</span> — 打开操作菜单</p>
            </div>
            <div class="section">
                <h4>💡 提示</h4>
                <p>每局有 <span>3 次</span> 踩雷撤销机会。<br>   🚩 插旗/取消插旗 &nbsp; <br>   ✨ 高亮/取消高亮 &nbsp; <br>   ❓ 问号/取消问号<br>作者：阮叉叉2649717385</p>
            </div>
            <button class="close-btn" id="helpCloseBtn">知道了</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  扫雷游戏 · 完整逻辑 (踩雷撤销, 每局3次机会)
        // ============================================================

        // -------- 手机端检测 --------
        const isTouchDevice = ('ontouchstart' in window) ||
            (navigator.maxTouchPoints > 0) ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

        // -------- 预设难度 --------
        const PRESETS = {
            easy: { rows: 10, cols: 10, mines: 10 },
            medium: { rows: 10, cols: 10, mines: 30 },
            hard: { rows: 10, cols: 10, mines: 50 },
        };

        // -------- DOM 引用 --------
        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mineCount');
        const unopenedCountEl = document.getElementById('unopenedCount');
        const timerEl = document.getElementById('timerDisplay');
        const resetBtn = document.getElementById('resetBtn');
        const gameOverlay = document.getElementById('gameOverlay');
        const resultMsg = document.getElementById('resultMsg');
        const subInfo = document.getElementById('subInfo');
        const overlayButtons = document.getElementById('overlayButtons');
        const customPanel = document.getElementById('customPanel');
        const customRows = document.getElementById('customRows');
        const customCols = document.getElementById('customCols');
        const customMines = document.getElementById('customMines');
        const applyCustom = document.getElementById('applyCustom');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuBackdrop = document.getElementById('mobileMenuBackdrop');
        const helpBtn = document.getElementById('helpBtn');
        const helpOverlay = document.getElementById('helpOverlay');

        const diffBtns = document.querySelectorAll('[data-diff]');

        // -------- 游戏状态 --------
        let state = {
            rows: 9,
            cols: 9,
            mines: 10,
            board: [],
            gameOver: false,
            paused: false,
            firstClick: true,
            flagCount: 0,
            openedCount: 0,
            timer: 0,
            timerInterval: null,
            difficulty: 'easy',
            isCustom: false,
            currentConfig: null,
            undoCount: 3,
            maxUndo: 3,
            lastState: null,
            explodedRow: -1,
            explodedCol: -1,
        };

        // 高亮相关
        let highlightedCells = [];
        let highlightSource = null;

        // 手机端长按相关
        let longPressTimer = null;
        let touchStartPos = null;
        let touchStartCell = null;
        let longPressTriggered = false;
        let mobileMenuTarget = null; // { row, col }

        // -------- 工具 --------
        function formatTime(sec) {
            return String(sec).padStart(3, '0').slice(0, 3);
        }

        // -------- 深拷贝棋盘 --------
        function cloneBoard(board) {
            return board.map(row => row.map(cell => ({ ...cell })));
        }

        // -------- 保存状态 (操作前) --------
        function saveState() {
            state.lastState = {
                board: cloneBoard(state.board),
                flagCount: state.flagCount,
                openedCount: state.openedCount,
                firstClick: state.firstClick,
            };
        }

        // -------- 恢复状态 (撤销) --------
        function restoreState() {
            if (!state.lastState) return false;
            const s = state.lastState;
            state.board = s.board;
            state.flagCount = s.flagCount;
            state.openedCount = s.openedCount;
            state.firstClick = s.firstClick;
            state.lastState = null;
            return true;
        }

        // -------- 初始化棋盘数据 --------
        function createBoard(rows, cols, mines) {
            const board = [];
            for (let r = 0; r < rows; r++) {
                board[r] = [];
                for (let c = 0; c < cols; c++) {
                    board[r][c] = {
                        mine: false,
                        opened: false,
                        flagged: false,
                        question: false,
                        neighborMines: 0,
                    };
                }
            }
            return board;
        }

        // -------- 放置地雷 --------
        function placeMines(board, rows, cols, mines, safeRow, safeCol) {
            const safeSet = new Set();
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = safeRow + dr,
                        nc = safeCol + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        safeSet.add(nr + ',' + nc);
                    }
                }
            }

            let placed = 0;
            const maxAttempts = rows * cols * 10;
            let attempts = 0;
            while (placed < mines && attempts < maxAttempts) {
                attempts++;
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);
                const key = r + ',' + c;
                if (!board[r][c].mine && !safeSet.has(key)) {
                    board[r][c].mine = true;
                    placed++;
                }
            }
            if (placed < mines) {
                for (let r = 0; r < rows && placed < mines; r++) {
                    for (let c = 0; c < cols && placed < mines; c++) {
                        const key = r + ',' + c;
                        if (!board[r][c].mine && !safeSet.has(key)) {
                            board[r][c].mine = true;
                            placed++;
                        }
                    }
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) count++;
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }

        // -------- 清除高亮 --------
        function clearHighlight() {
            highlightedCells.forEach(el => el.classList.remove('highlight'));
            highlightedCells = [];
            highlightSource = null;
        }

        // -------- 高亮周围8格 --------
        function highlightNeighbors(row, col) {
            clearHighlight();
            const { rows, cols } = state;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = row + dr,
                        nc = col + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        const el = boardEl.querySelector(`.cell[data-row="${nr}"][data-col="${nc}"]`);
                        if (el) {
                            el.classList.add('highlight');
                            highlightedCells.push(el);
                        }
                    }
                }
            }
            highlightSource = { row, col };
        }

        // -------- 计算周围旗子数量 --------
        function countFlagsAround(row, col) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = row + dr, nc = col + dc;
                    if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols && state.board[nr][nc].flagged) cnt++;
                }
            }
            return cnt;
        }

        // ============================================================
        //  操作菜单
        // ============================================================
        function showMobileMenu(row, col, clientX, clientY) {
            if (state.gameOver || state.paused) return;

            mobileMenuTarget = { row, col };
            const cell = state.board[row][col];

            const flagBtn = mobileMenu.querySelector('.flag-btn');
            const questionBtn = mobileMenu.querySelector('.question-btn');
            const highlightBtn = mobileMenu.querySelector('.highlight-btn');

            // 动态更新按钮文案
            const flagLabel = flagBtn.querySelector('.label');
            const questionLabel = questionBtn.querySelector('.label');
            const highlightLabel = highlightBtn.querySelector('.label');

            // 插旗按钮：已插旗 → "取消插旗"
            if (cell.flagged) {
                flagLabel.textContent = '取消插旗';
                flagBtn.classList.remove('disabled');
            } else {
                flagLabel.textContent = '插旗';
                flagBtn.classList.remove('disabled');
            }

            // 问号按钮：已是问号 → "取消问号"
            if (cell.question) {
                questionLabel.textContent = '取消问号';
                questionBtn.classList.remove('disabled');
            } else {
                questionLabel.textContent = '问号';
                questionBtn.classList.remove('disabled');
            }

            // 高亮按钮：如果当前格子是高亮源 → "取消高亮"
            if (highlightSource && highlightSource.row === row && highlightSource.col === col) {
                highlightLabel.textContent = '取消高亮';
            } else {
                highlightLabel.textContent = '高亮';
            }

            // 已打开的格子：插旗和问号按钮置灰
            if (cell.opened) {
                flagBtn.classList.add('disabled');
                questionBtn.classList.add('disabled');
            }

            // 计算菜单位置：优先显示在触摸点上方，空间不足则显示在下方
            const menuW = mobileMenu.offsetWidth || 190;
            const menuH = mobileMenu.offsetHeight || 80;
            const padding = 12;

            let left = clientX - menuW / 2;
            let top = clientY - menuH - padding;

            // 水平边界修正
            if (left < padding) left = padding;
            if (left + menuW > window.innerWidth - padding) left = window.innerWidth - menuW - padding;

            // 垂直边界修正：上方空间不够就放下方
            if (top < padding) {
                top = clientY + padding;
            }

            mobileMenu.style.left = left + 'px';
            mobileMenu.style.top = top + 'px';

            // 短暂震动反馈（如果设备支持）
            if (navigator.vibrate) {
                navigator.vibrate(15);
            }

            mobileMenu.classList.add('show');
            mobileMenuBackdrop.classList.add('active');
        }

        function hideMobileMenu() {
            mobileMenu.classList.remove('show');
            mobileMenuBackdrop.classList.remove('active');
            mobileMenuTarget = null;
            longPressTriggered = false;
        }

        function handleMobileMenuAction(action) {
            if (!mobileMenuTarget) return;
            const { row, col } = mobileMenuTarget;
            const cell = state.board[row][col];

            switch (action) {
                case 'flag':
                    // 插旗：空白→插旗，已插旗→取消为空白，问号→插旗
                    saveState();
                    if (!cell.flagged && !cell.question) {
                        // 空白 → 插旗
                        cell.flagged = true;
                        state.flagCount++;
                    } else if (cell.flagged) {
                        // 取消插旗 → 空白
                        cell.flagged = false;
                        state.flagCount--;
                    } else if (cell.question) {
                        // 问号 → 插旗
                        cell.question = false;
                        cell.flagged = true;
                        state.flagCount++;
                    }
                    updateMineCounter();
                    render();
                    break;

                case 'highlight':
                    // 如果已经高亮此格子，则取消高亮；否则高亮
                    if (highlightSource && highlightSource.row === row && highlightSource.col === col) {
                        clearHighlight();
                    } else {
                        highlightNeighbors(row, col);
                    }
                    break;

                case 'question':
                    // 问号切换
                    saveState();
                    if (cell.flagged) {
                        cell.flagged = false;
                        state.flagCount--;
                    }
                    if (cell.question) {
                        cell.question = false;
                    } else {
                        cell.question = true;
                    }
                    updateMineCounter();
                    render();
                    break;
            }
            hideMobileMenu();
        }

        // -------- 手机端触摸事件处理 --------
        function handleTouchStart(e) {
            if (!isTouchDevice) return;
            if (state.gameOver || state.paused) return;

            const cellEl = e.target.closest('.cell');
            if (!cellEl) { hideMobileMenu(); return; }

            const row = parseInt(cellEl.dataset.row);
            const col = parseInt(cellEl.dataset.col);

            // 有高亮时，触摸任何格子先取消高亮
            if (highlightedCells.length > 0) {
                clearHighlight();
                return;
            }

            const touch = e.touches[0];

            touchStartPos = { x: touch.clientX, y: touch.clientY };
            touchStartCell = { row, col };
            longPressTriggered = false;

            // 启动长按计时器（500ms）
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                // 摇晃反馈
                if (navigator.vibrate) {
                    navigator.vibrate([10, 30, 10]);
                }
                showMobileMenu(touchStartCell.row, touchStartCell.col, touchStartPos.x, touchStartPos.y);
            }, 500);
        }

        function handleTouchMove(e) {
            if (!isTouchDevice || !longPressTimer) return;

            const touch = e.touches[0];
            if (touchStartPos) {
                const dx = Math.abs(touch.clientX - touchStartPos.x);
                const dy = Math.abs(touch.clientY - touchStartPos.y);
                // 移动超过阈值则取消长按
                if (dx > 10 || dy > 10) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                    touchStartCell = null;
                }
            }
        }

        function handleTouchEnd(e) {
            if (!isTouchDevice) return;

            // 清除长按计时器
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;

                // 短按 = 打开格子 / 数字格自动展开
                if (!longPressTriggered && touchStartCell && !mobileMenu.classList.contains('show')) {
                    const { row, col } = touchStartCell;
                    const cell = state.board[row][col];

                    // 有高亮时，短按取消高亮
                    if (highlightedCells.length > 0) {
                        clearHighlight();
                        return;
                    }

                    if (cell.opened && !cell.mine && cell.neighborMines > 0) {
                        // 数字格：周围旗子匹配则自动展开
                        if (countFlagsAround(row, col) === cell.neighborMines) {
                            if (navigator.vibrate) navigator.vibrate(8);
                            quickExpand(row, col);
                        }
                    } else if (!cell.opened && !cell.flagged && !cell.question) {
                        // 轻触反馈
                        if (navigator.vibrate) {
                            navigator.vibrate(8);
                        }
                        openCell(row, col);
                    }
                }
            }

            if (!longPressTriggered && touchStartCell) {
                // 短按结束后的清理
            }
        }

        function handleTouchCancel(e) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
            touchStartCell = null;
            touchStartPos = null;
            longPressTriggered = false;
        }

        // 全局触摸：点击棋盘外部关闭菜单并清除高亮
        function handleGlobalTouchStart(e) {
            if (!mobileMenu.classList.contains('show') && highlightedCells.length === 0) return;
            // 检查触摸目标是否在菜单内
            if (!mobileMenu.contains(e.target) && !e.target.closest('.cell')) {
                hideMobileMenu();
                clearHighlight();
            }
        }

        // -------- 渲染棋盘 --------
        function render() {
            const { rows, cols, board } = state;
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            boardEl.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = board[r][c];
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.dataset.row = r;
                    div.dataset.col = c;

                    if (cell.opened) {
                        div.classList.add('opened');
                        if (cell.mine) {
                            div.classList.add('mine-shown');
                            if (cell.exploded) {
                                div.classList.add('mine-exploded');
                            }
                        } else if (cell.neighborMines > 0) {
                            div.textContent = cell.neighborMines;
                            div.classList.add('n' + cell.neighborMines);
                        }
                    } else {
                        if (cell.flagged) {
                            div.classList.add('flagged');
                        } else if (cell.question) {
                            div.classList.add('question');
                        }
                    }

                    if (state.gameOver || state.paused) {
                        div.classList.add('disabled');
                    }
                    if (state.paused) {
                        div.classList.add('paused');
                    }

                    boardEl.appendChild(div);
                }
            }

            updateMineCounter();
            // 注意：render 会重建 DOM，高亮引用失效，需清空
            highlightedCells = [];
            highlightSource = null;
        }

        // -------- 更新雷数 & 未打开格子 --------
        function updateMineCounter() {
            const remaining = state.mines - state.flagCount;
            mineCountEl.textContent = Math.max(0, remaining);
            const unopened = state.rows * state.cols - state.openedCount - state.flagCount;
            unopenedCountEl.textContent = Math.max(0, unopened);
        }

        // -------- 打开格子 --------
        function openCell(row, col) {
            if (state.gameOver || state.paused) return;
            const { board, rows, cols } = state;
            const cell = board[row][col];
            if (cell.opened || cell.flagged || cell.question) return;

            saveState();

            if (state.firstClick) {
                placeMines(board, rows, cols, state.mines, row, col);
                state.firstClick = false;
                startTimer();
            }

            if (cell.mine) {
                cell.opened = true;
                cell.exploded = true;
                state.explodedRow = row;
                state.explodedCol = col;
                showExplosionMenu();
                render();
                return;
            }

            const queue = [[row, col]];
            const visited = new Set();
            visited.add(row + ',' + col);

            while (queue.length > 0) {
                const [r, c] = queue.shift();
                const cur = board[r][c];
                if (cur.opened) continue;
                cur.opened = true;
                state.openedCount++;

                if (cur.neighborMines === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
                            const key = nr + ',' + nc;
                            if (visited.has(key)) continue;
                            const neighbor = board[nr][nc];
                            if (!neighbor.opened && !neighbor.flagged && !neighbor.question) {
                                visited.add(key);
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }
            }

            checkWin();
            render();
        }

        // -------- 内部展开函数（不保存状态，由quickExpand负责保存） --------
        function _expandNeighbors(row, col) {
            const { board, rows, cols } = state;
            const cell = board[row][col];
            if (!cell.opened || cell.mine) return;
            if (cell.neighborMines === 0) return;

            if (countFlagsAround(row, col) === cell.neighborMines) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = row + dr,
                            nc = col + dc;
                        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
                        const neighbor = board[nr][nc];
                        if (!neighbor.opened && !neighbor.flagged) {
                            _openCellInternal(nr, nc);
                        }
                    }
                }
            }
        }

        // 内部打开函数（不保存状态，用于批量展开）
        function _openCellInternal(row, col) {
            const { board, rows, cols } = state;
            const cell = board[row][col];
            if (cell.opened || cell.flagged || cell.question) return;

            if (cell.mine) {
                cell.opened = true;
                cell.exploded = true;
                state.explodedRow = row;
                state.explodedCol = col;
                showExplosionMenu();
                render();
                return;
            }

            const queue = [[row, col]];
            const visited = new Set();
            visited.add(row + ',' + col);

            while (queue.length > 0) {
                const [r, c] = queue.shift();
                const cur = board[r][c];
                if (cur.opened) continue;
                cur.opened = true;
                state.openedCount++;

                if (cur.neighborMines === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
                            const key = nr + ',' + nc;
                            if (visited.has(key)) continue;
                            const neighbor = board[nr][nc];
                            if (!neighbor.opened && !neighbor.flagged && !neighbor.question) {
                                visited.add(key);
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }
            }
        }

        // 外部调用 quickExpand
        function quickExpand(row, col) {
            if (state.gameOver || state.paused) return;
            const { board } = state;
            const cell = board[row][col];
            if (!cell.opened || cell.mine) return;
            if (cell.neighborMines === 0) return;

            saveState();
            _expandNeighbors(row, col);
            render();
            checkWin();
        }

        // -------- 检查胜利 --------
        function checkWin() {
            if (state.gameOver || state.paused) return;
            const { rows, cols, board, mines } = state;
            let opened = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].opened) opened++;
                }
            }
            if (opened === rows * cols - mines) {
                state.gameOver = true;
                stopTimer();
                showWinMenu();
            }
        }

        // -------- 显示踩雷菜单 --------
        function showExplosionMenu() {
            state.paused = true;
            stopTimer();
            hideMobileMenu();
            clearHighlight();
            gameOverlay.classList.add('show');
            resultMsg.textContent = '💥 踩到地雷！';
            resultMsg.className = 'msg lose';
            subInfo.textContent = `剩余撤销次数：${state.undoCount}`;

            overlayButtons.innerHTML = '';

            const btnRestart = document.createElement('button');
            btnRestart.className = 'btn-overlay primary';
            btnRestart.textContent = '重新开始';
            btnRestart.addEventListener('click', () => {
                resetGame();
                state.undoCount = state.maxUndo;
                gameOverlay.classList.remove('show');
                state.paused = false;
                render();
            });
            overlayButtons.appendChild(btnRestart);

            const btnUndo = document.createElement('button');
            btnUndo.className = 'btn-overlay danger';
            btnUndo.textContent = '撤销 (剩余' + state.undoCount + '次)';
            if (state.undoCount <= 0 || !state.lastState) {
                btnUndo.disabled = true;
            }
            btnUndo.addEventListener('click', () => {
                if (state.undoCount > 0 && state.lastState) {
                    if (restoreState()) {
                        state.undoCount--;
                        state.paused = false;
                        gameOverlay.classList.remove('show');
                        render();
                        startTimer();
                    }
                }
            });
            overlayButtons.appendChild(btnUndo);

            document.querySelectorAll('.cell').forEach(el => el.classList.add('disabled', 'paused'));
        }

        // -------- 显示胜利菜单 --------
        function showWinMenu() {
            hideMobileMenu();
            clearHighlight();
            gameOverlay.classList.add('show');
            resultMsg.textContent = '🎉 恭喜你赢了！';
            resultMsg.className = 'msg win';
            subInfo.textContent = '';
            overlayButtons.innerHTML = '';
            const btnRestart = document.createElement('button');
            btnRestart.className = 'btn-overlay primary';
            btnRestart.textContent = '再来一把';
            btnRestart.addEventListener('click', () => {
                resetGame();
                state.undoCount = state.maxUndo;
                gameOverlay.classList.remove('show');
                render();
            });
            overlayButtons.appendChild(btnRestart);
            document.querySelectorAll('.cell').forEach(el => el.classList.add('disabled'));
        }

        // -------- 计时器 --------
        function startTimer() {
            if (state.timerInterval) return;
            state.timer = 0;
            timerEl.textContent = formatTime(0);
            state.timerInterval = setInterval(() => {
                state.timer++;
                if (state.timer > 999) state.timer = 999;
                timerEl.textContent = formatTime(state.timer);
            }, 1000);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        // -------- 重置游戏 --------
        function resetGame() {
            stopTimer();
            gameOverlay.classList.remove('show');
            hideMobileMenu();
            state.gameOver = false;
            state.paused = false;
            state.firstClick = true;
            state.flagCount = 0;
            state.openedCount = 0;
            state.timer = 0;
            timerEl.textContent = '000';
            resetBtn.textContent = '😊';
            state.undoCount = state.maxUndo;
            state.lastState = null;
            clearHighlight();

            const { rows, cols, mines } = state;
            state.board = createBoard(rows, cols, mines);
            render();
            updateMineCounter();
        }

        // -------- 设置难度 --------
        function setDifficulty(diff, customData = null) {
            let config;
            if (diff === 'custom' && customData) {
                config = customData;
                state.isCustom = true;
            } else if (PRESETS[diff]) {
                config = PRESETS[diff];
                state.isCustom = false;
            } else {
                config = PRESETS.easy;
                state.isCustom = false;
            }

            let rows = Math.min(30, Math.max(4, config.rows));
            let cols = Math.min(30, Math.max(4, config.cols));
            let mines = Math.min(rows * cols - 1, Math.max(1, config.mines));

            state.rows = rows;
            state.cols = cols;
            state.mines = mines;
            state.difficulty = diff;
            state.currentConfig = { rows, cols, mines };

            customRows.value = rows;
            customCols.value = cols;
            customMines.value = mines;

            diffBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });

            state.undoCount = state.maxUndo;
            resetGame();
        }

        // -------- 处理格子点击（桌面端左键） --------
        function handleCellClick(e) {
            const cellEl = e.target.closest('.cell');
            if (!cellEl) return;
            if (state.gameOver || state.paused) return;

            // 仅处理左键
            if (e.button !== 0) return;

            const row = parseInt(cellEl.dataset.row);
            const col = parseInt(cellEl.dataset.col);
            const cell = state.board[row][col];

            // 有高亮时，左键点击任意格子取消高亮，不打开任何格子
            if (highlightedCells.length > 0) {
                clearHighlight();
                return;
            }

            // 已打开的数字格：旗子数匹配则自动展开周围
            if (cell.opened && !cell.mine && cell.neighborMines > 0) {
                if (countFlagsAround(row, col) === cell.neighborMines) {
                    quickExpand(row, col);
                }
                return;
            }

            // 未打开的非旗非问号格子：翻开
            if (!cell.opened && !cell.flagged && !cell.question) {
                openCell(row, col);
            }
        }

        // -------- 事件绑定 --------
        boardEl.addEventListener('mousedown', handleCellClick);

        // 桌面端右键弹出操作菜单
        boardEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            hideMobileMenu();
            if (state.gameOver || state.paused) return;
            const cellEl = e.target.closest('.cell');
            if (!cellEl) return;
            const row = parseInt(cellEl.dataset.row);
            const col = parseInt(cellEl.dataset.col);

            // 有高亮时，右键取消高亮
            if (highlightedCells.length > 0) {
                clearHighlight();
                return;
            }

            showMobileMenu(row, col, e.clientX, e.clientY);
        });

        // 全局禁止浏览器右键菜单
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 桌面端点击菜单外部关闭 + 清除高亮
        document.addEventListener('click', (e) => {
            if (mobileMenu.classList.contains('show') && !mobileMenu.contains(e.target) && !e.target.closest('.cell')) {
                hideMobileMenu();
            }
            // 点击棋盘外部区域清除高亮
            if (highlightedCells.length > 0 && !e.target.closest('.cell') && !e.target.closest('.mobile-menu')) {
                clearHighlight();
            }
        });

        // ESC 键关闭菜单 + 清除高亮
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideMobileMenu();
                clearHighlight();
            }
        });

        // 手机端触摸事件
        if (isTouchDevice) {
            boardEl.addEventListener('touchstart', handleTouchStart, { passive: false });
            boardEl.addEventListener('touchmove', handleTouchMove, { passive: false });
            boardEl.addEventListener('touchend', handleTouchEnd, { passive: false });
            boardEl.addEventListener('touchcancel', handleTouchCancel);
            // 禁止 iOS 长按弹出选择菜单
            boardEl.addEventListener('contextmenu', (e) => e.preventDefault());

            // 点击棋盘外部关闭菜单 + 清除高亮
            document.addEventListener('touchstart', handleGlobalTouchStart, { passive: true });

            // 阻止双击缩放（在棋盘区域）
            boardEl.addEventListener('dblclick', (e) => {
                e.preventDefault();
            });
        }

        // 手机菜单按钮点击
        mobileMenu.querySelectorAll('.mobile-menu-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const action = btn.dataset.action;
                if (action) handleMobileMenuAction(action);
            });
            // 触摸事件也需要绑定（避免 click 延迟）
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const action = btn.dataset.action;
                if (action) handleMobileMenuAction(action);
            });
        });

        // 点击遮罩关闭菜单
        mobileMenuBackdrop.addEventListener('click', hideMobileMenu);
        mobileMenuBackdrop.addEventListener('touchend', (e) => {
            e.preventDefault();
            hideMobileMenu();
        });

        resetBtn.addEventListener('click', () => {
            resetGame();
            state.undoCount = state.maxUndo;
            gameOverlay.classList.remove('show');
            render();
        });

        // 帮助按钮
        helpBtn.addEventListener('click', () => {
            helpOverlay.classList.add('show');
        });
        document.getElementById('helpCloseBtn').addEventListener('click', () => {
            helpOverlay.classList.remove('show');
        });
        helpOverlay.addEventListener('click', (e) => {
            if (e.target === helpOverlay) helpOverlay.classList.remove('show');
        });

        diffBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.diff;
                if (diff === 'custom') {
                    customPanel.classList.toggle('show');
                    if (customPanel.classList.contains('show')) {
                        customRows.focus();
                    }
                    btn.classList.toggle('active');
                    return;
                }
                customPanel.classList.remove('show');
                document.querySelector('[data-diff="custom"]')?.classList.remove('active');
                setDifficulty(diff);
            });
        });

        applyCustom.addEventListener('click', () => {
            let rows = parseInt(customRows.value) || 9;
            let cols = parseInt(customCols.value) || 9;
            let mines = parseInt(customMines.value) || 10;
            rows = Math.min(30, Math.max(4, rows));
            cols = Math.min(30, Math.max(4, cols));
            mines = Math.min(rows * cols - 1, Math.max(1, mines));
            customRows.value = rows;
            customCols.value = cols;
            customMines.value = mines;

            diffBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === 'custom');
            });
            document.querySelector('[data-diff="custom"]')?.classList.add('active');

            setDifficulty('custom', { rows, cols, mines });
            customPanel.classList.remove('show');
        });

        [customRows, customCols, customMines].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') applyCustom.click();
            });
        });

        // 初始启动
        setDifficulty('easy');
        // 自适应字号
        function adjustCellSize() {
            const cells = document.querySelectorAll('.cell');
            const { rows, cols } = state;
            const total = rows * cols;
            let fontSize = 18;
            if (total > 300) fontSize = 14;
            if (total > 500) fontSize = 12;
            if (total > 700) fontSize = 10;
            if (total > 900) fontSize = 9;
            cells.forEach(el => {
                el.style.fontSize = fontSize + 'px';
            });
        }

        const originalRender = render;
        render = function () {
            originalRender();
            adjustCellSize();
        };

        render();
        console.log('✨ 扫雷 · 阮叉叉版 已启动！');
        if (isTouchDevice) {
            console.log('📱 检测到触摸设备，已启用手机端操作模式');
            console.log('   👆 单击 = 翻开格子 / 数字格自动展开');
            console.log('   👆👆 长按 = 打开操作菜单（插旗/高亮/问号）');
        } else {
            console.log('🖥 桌面端模式');
            console.log('   🖱 左键 = 翻开格子 / 数字格旗子匹配自动展开');
            console.log('   🖱 右键 = 弹出操作菜单（插旗/高亮/问号）');
        }
    </script>

</body>
